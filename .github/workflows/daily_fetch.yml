name: Daily Food Price Fetch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Debug check API_URL
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL is EMPTY or MISSING"
          else
            echo "API_URL exists, length is: ${#API_URL}"
          fi
          
      - name: Run tests
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          pip install -r requirements.txt
          pip install pytest
          pytest test_pipeline.py
          
      - name: Build Docker image
        run: docker build -t foodprices_pipeline .

      - name: Run pipeline container
        run: |
          docker run --rm \
            -e API_URL=${{ secrets.API_URL }} \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            foodprices_pipeline